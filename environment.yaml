name: field_train
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=23.3.2
  - pip:
      - opencv-python==4.9.0.80
      - numpy==1.26.4
      - pandas==2.2.0
      - matplotlib==3.8.4
      - pillow==10.3.0
      - tqdm==4.67.1
      - pyyaml==6.0.1
      - scikit-image==0.24.0
      - hydra-core==1.3.2
      - wandb==0.21.0
      - omegaconf==2.3.0
      - fiftyone==1.5.2
      # Segmentation & Metrics
      - torch==2.5.1
      - torchvision==0.20.1
      - pytorch-lightning==2.5.1
      - segmentation-models-pytorch==0.5.0
      - torchmetrics==1.6.0
      # GPU utility
      - gputil==1.4.0
      # Optional / Future use
      - ultralytics==8.3.9  # only needed if you explicitly use YOLO-based models
