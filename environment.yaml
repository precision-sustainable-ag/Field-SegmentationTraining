name: field_train
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - opencv
  - numpy
  - pandas
  - matplotlib
  - pillow
  - pytorch
  - torchvision
  - tqdm
  - pyyaml
  - scikit-image
  - hydra-core
  - wandb
  - omegaconf
  - cudatoolkit  # version matching your CUDA + A100
  - fiftyone
  - pip:
      # Segmentation & Metrics
      - segmentation-models-pytorch
      - torchmetrics
      # GPU utility
      - gputil
      # Optional / Future use
      - ultralytics  # only needed if you explicitly use YOLO-based models
