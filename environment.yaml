name: Field_SegmentationTraining
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
  - pillow
  - pytorch
  - torchvision
  - tqdm
  - pyyaml
  - cudatoolkit  # version matching your CUDA + A100
  - pip:

      # Logging / Config
      - wandb
      - omegaconf
      - hydra-core

      # Segmentation & Metrics
      - segmentation-models-pytorch
      - torchmetrics

      # GPU utility
      - gputil

      # Optional / Future use
      - ultralytics  # only needed if you explicitly use YOLO-based models
