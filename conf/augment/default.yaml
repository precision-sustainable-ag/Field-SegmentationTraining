# All data‐augmentation transforms. Your datamodule should read these keys 
# and apply the appropriate torchvision / albumentations transforms.
# conf/augment/default.yaml

# ─── how many samples to visualize each epoch ─────────────────────────────
augmentation_visualizer:
  enable: true        # toggle on/off
  num_samples: 4      # how many image+mask pairs to log

  # ─── legend panel settings ─────────────────────────────────────────
  legend:
    # font size = max(min_font_size, height / font_divisor)
    font_divisor: 40
    min_font_size: 12

# ─── train transformations ──────────────────────────────────────────
train:
  enable: true
  
  # target size for all spatial ops (pad/crop/resize happens upstream)
  img_size:
    height: ${preprocess.pad_gridcrop_resize.size.height}
    width:  ${preprocess.pad_gridcrop_resize.size.width}

  spatial:
    enable: true     # master switch for all spatial transforms

    # ─── pick some spatial ops ───────────────────────────────
    # with probability p, applies some n of the spatial transforms with/without replacement
    some_of:
      enable: true
      p: 1.0
      n: 4
      replace: false

    # simple flips & rotations
    horizontal_flip:
      enable: true
      p: 0.5         # mirror left‐right
    vertical_flip:
      enable: true
      p: 0.3         # mirror up‐down
    random_rotate90:
      enable: true
      p: 0.5         # rotate by a multiple of 90°

    # cropping and geometric warps
    random_crop:
      enable: true
      p: 0.5
      height: ${augment.train.img_size.height}
      width:  ${augment.train.img_size.width}
    affine:
      enable: true
      p: 0.3
      scale: [0.9, 1.1]
      translate_percent: [-0.1, 0.1]
      rotate: [-15, 15]
      shear: [-10, 10]
    elastic_transform:
      enable: true
      p: 0.2
      alpha: 120
      sigma: 8            # elastic distortions
    grid_distortion:
      enable: true
      p: 0.2
      num_steps: 5
      distort_limit: [-0.3, 0.3]
    perspective:
      enable: true
      p: 0.2
      scale: [0.1, 0.2]
      fit_output: false
    optical_distortion:
      enable: true
      p: 0.2
      distort_limit: [-0.2, 0.2]
    random_scale:
      enable: true
      p: 0.3
      scale_limit: [0.8, 1.2]         # random zoom in/out
    shift_scale_rotate:
      enable: true
      p: 0.3
      shift_limit: 0.1
      scale_limit: 0.1
      rotate_limit: 30
    coarse_dropout:
      enable: true
      p: 0.2                   # “black out”
      
  pixel:
    enable: true     # master switch for all pixel‐level transforms

    # ─── pick some pixel‐level ops ─────────────────────────────
    # with probability p, applies some n of the pixel transforms with/without replacement
    some_of:
      enable: true
      p: 1.0
      n: 4
      replace: false

    # color and brightness adjustments
    color_jitter:
      enable: true
      p: 0.5
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
    random_brightness_contrast:
      enable: true
      p: 0.5
      brightness_limit: 0.2
      contrast_limit: 0.2
    random_gamma:
      enable: true
      p: 0.3
      gamma_limit: [80, 120]

    # noise injection
    gauss_noise:
      enable: true
      p: 0.3
    multiplicative_noise:
      enable: true
      p: 0.2
      multiplier: [0.9, 1.1]
      per_channel: true
    iso_noise:
      enable: true
      p: 0.2
      color_shift: [0.01, 0.05]
      intensity: [0.05, 0.2]

    # advanced pixel ops
    clahe:
      enable: true
      p: 0.3
      clip_limit: 2.0
      tile_grid_size: [8, 8]  # adaptive histogram equalization
    image_compression:
      enable: true
      p: 0.3                   # simulate JPEG artifacts

    # new pixel‐level additions
    rgb_shift:
      enable: true
      p: 0.2
      r_shift_limit: [-20, 20]
      g_shift_limit: [-20, 20]
      b_shift_limit: [-20, 20]
    channel_shuffle:
      enable: true
      p: 0.2                   # random re‐ordering of channels

    # ─── batch-level mixing ops ─────────────────────────────────────
  batch:
    enable: true           # master switch for batch mixing ops

    mosaic:
      enable: true        # master switch for Mosaic
      p: 0.8              # probability per batch

    cutmix:
      enable: true         # master switch for CutMix
      p: 0.8               # probability per batch
      alpha: 1.0           # Beta(alpha,alpha) hyperparameter

    mixup:
      enable: false        # master switch for MixUp
      p: 0.5               # probability per batch
      alpha: 0.4           # Beta(alpha,alpha) hyperparameter

# ─── validation (only resize/pad) ────────────────────────────────────
val:
  enable: true
  img_size:
    height: ${augment.train.img_size.height}
    width:  ${augment.train.img_size.width}

  spatial:
    enable: true
    horizontal_flip:
      enable: false
    random_crop:
      enable: false

  pixel:
    enable: false
  
  batch:
    enable: false           # no batch mixing on validation


# ─── test (no augment) ───────────────────────────────────────────────
test:
  enable: false