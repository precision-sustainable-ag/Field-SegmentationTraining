# conf/inference/yolo_detect.yaml
# Inference configuration strictly for YOLO object detection.

input_dir: ${paths.test_images_dir}        # Directory to read images from
output_root: ${paths.project_inference_dir}
weights_path: ${paths.local_yolo_weed_detection_model}

# ─── Image Processing ───────────────────────────────────────────────
image_processing:
  size:
    height: 1024
    width: 1024
  rect: true       # True: Use rectangular inference (no padding) | false: square inference (with padding)

# ─── YOLO26 & Detection Control ────────────────────────────────────────
end2end: true       # true: YOLO26 end-to-end (no NMS) | false: traditional NMS head
max_det: 300        # Maximum number of detections per image (default: 300)

# ─── YOLO Thresholds ──────────────────────────────────────────────────
conf: 0.25  # Confidence threshold for keeping a bounding box
iou: 0.45   # Intersection over Union threshold for Non-Maximum Suppression (NMS)

# ─── Hardware & Precision ─────────────────────────────────────────────
precision: 16       # 16 for FP16, 32 for FP32, 8 for INT8 (Replaces legacy 'amp')

gpu:
  enable: true
  max_gpus: 1           # YOLO inference generally only needs 1 GPU
  exclude_gpu_ids: [0]  # Skip GPU 0 if it's currently busy with training

# ─── Export Settings (Used by Export Pipeline) ─────────────────────────
export:
  format: "engine"   # Target export format (e.g., "engine", "onnx", "torchscript")
  end2end: true      # Export end-to-end graph without NMS operator
  max_det: 300
  quantize: 32       # 16 for FP16 precision export (Replaces legacy 'half')
  device: 0
  workspace: 4

# ─── Logging ──────────────────────────────────────────────────────────
logger:
  wandb:
    enable: false       # Usually off for inference, but available if needed
    project: ${project.name}
    entity: "sbaghba"
    log_model: false
    run_name: ""