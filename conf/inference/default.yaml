# Inference + evaluation settings. 
# src/inference.py should load the trained model, run predictions, threshold,
# save predicted masks, then compute IoU vs gold masks if available.

batch_size: 8
device: "cuda"

# Test‐time augmentation (TTA):
tta:
  enabled: false
  horizontal_flip: true
  vertical_flip: false

threshold: 0.5
save_masks: true
save_overlay: false    # if true, also save image+mask overlay under inference_results_dir/overlays

# If you have a “test” folder, compute IoU vs ground truth automatically:
evaluate:
  enabled: true