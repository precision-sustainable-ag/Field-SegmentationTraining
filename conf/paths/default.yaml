# All filesystem paths, built from base_dir + project‐specific subfolders

base_dir: ${hydra:runtime.cwd}                      # usually the repo root
data_dir: ${paths.base_dir}/data

project_dir: ${paths.base_dir}/projects/${project.name}

project_preprocess_dir: ${paths.project_dir}/preprocess 
preprocess_split_dir: ${paths.project_preprocess_dir}/train_val_test_split 

# Preprocess stats and image list files
preprocess_stats_file: ${paths.project_preprocess_dir}/data_stats.txt
preprocess_image_list_file: ${paths.project_preprocess_dir}/images.txt

# Train, validation, and test directories for both images and masks
train_images_dir: ${paths.preprocess_split_dir}/train/images
train_masks_dir: ${paths.preprocess_split_dir}/train/masks
val_images_dir: ${paths.preprocess_split_dir}/val/images
val_masks_dir: ${paths.preprocess_split_dir}/val/masks
test_images_dir: ${paths.preprocess_split_dir}/test/images
test_masks_dir: ${paths.preprocess_split_dir}/test/masks


project_train_dir: ${paths.project_dir}/train  
project_maskgen_dir: ${paths.project_dir}/maskgen  
project_inference_dir: ${paths.project_dir}/inference  

# (Optional) any external weights you need, e.g. SAM model or YOLO:
sam_checkpoint: "${paths.data_dir}/external_weights/sam_vit_b.pth"
yolo_model_path: "${paths.data_dir}/external_weights/yolo_weed.pt"
