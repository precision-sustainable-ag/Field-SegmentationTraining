# Top‐level Hydra configuration. Lists each config group in the "defaults:" section.
# Order matters: later entries can override earlier keys.

defaults:
  - paths: default             # all filesystem paths (data_dir, model_save_dir, etc.)
  - model: unet                # architecture group: unet (can switch to deeplabv3plus, etc.)
  - train: default             # training hyperparameters + Lightning Trainer settings
  - augment: default           # data augmentation transforms
  - preprocess: default        # resizing / normalization / cropping
  - maskgen: default           # mask generation/refinement settings
  - inference: default         # inference & evaluation settings
  - evaluation: default         # evaluation metrics and settings
  - hydra/job_logging: custom  # a custom logging config (Hydra job logger override)
  - _self_                     # Ensures overriding behavior

# Any keys you want to sit “outside” those groups:
project:
  # Note: project_name typically duplicated from projects.field.project_name, but putting here
  name: field


mode: train                  # one of: maskgen / preprocess / train / inference

tasks:
  preprocess:
    - normalize
    - remap
    - center_crop
  maskgen:
    - # TBD
  train:
    - train
  inference:
    - inference


# You can add any global flags here if desired, e.g. debug: false, seed: 42, etc.
hydra:
  run:
    dir: ${paths.base_dir}/logs/${hydra.job.name}/${hydra.job.num}
  job_logging:
    custom: ${hydra.job_logging.custom}
