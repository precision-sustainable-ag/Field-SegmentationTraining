# conf/config.yaml

# Top‐level Hydra configuration. Lists each config group in the "defaults:" section.
# Order matters: later entries can override earlier keys.
# Hydra defaults and settings. 
defaults:
  - paths: default             # all filesystem paths (data_dir, model_save_dir, etc.)
  - model: yolov8_detect                # architecture group: unet (can switch to deeplabv3plus, etc.)
  - train: yolo_detect             # training hyperparameters + Lightning Trainer settings
  - augment: field_strong           # data augmentation transforms
  - preprocess: yolo_detect        # resizing / normalization / cropping
  - inference: yolo_detect         # inference & evaluation settings
  - evaluation: default         # evaluation metrics and settings
  - mask_gen: default
  - create_project: default
  - finalize: default          # finalization settings
  - llm: default               # LLM settings 
  - override hydra/job_logging: custom # a custom logging config (Hydra job logger override)
  - _self_                     # Ensures overriding behavior

# Any keys you want to sit “outside” those groups:
project:
  # Note: project_name typically duplicated from projects.field.project_name, but putting here
  name: rede # or field

mode: detect                  # one of: mask_gen / preprocess / train / inference / finalize / llm

tasks:
  preprocess:
    pad_gridcrop_resize: false
    train_val_test_split: false
    compute_data_stats: true

  mask_gen:
    sync: false # skip for now; copies the most up-to-date version of the files needed to run the mask_gen mode from LTS to here
    create_project: false
    detect: false
    segment: false
    inspect: false
    refine: false
    upload_cvat: false
    export_cvat: false

  train:
    vis_augment: true
    train_pipeline: true

  finalize:
    finalize_lts: false

  inference:
    local: true
    lts: false

  llm:
    tabulate_hparams: false
    summarize_run: false

  detect:
    train: true
    inference: false
    export: false

# You can add any global flags here if desired, e.g. debug: false, seed: 42, etc.
hydra:
  run:
    # base of all outputs for train mode
    dir: ${paths.project_dir}/${mode}
  sweep:
    dir: ${paths.project_mode_dir}/multirun

test:
  enabled: true

mask_inspect: # TODO: what is this for?
  save2lts: false

job:
  job_now_date: &nowdir ${now:%Y-%m-%d}
  job_now_time: ${now:%H_%M_%S}
  job_now: ${job.job_now_date}/${job.job_now_time} 
  jobdir: ${paths.data_dir}/${job.job_now}
