inspect:
  dataset_name: testing_inspect_maskgen
  port: 5050
  only_include_tags:
    - missing_red


refine:
  only_include_tags:
    - missing_red
  # Morphological operations and HSV color ranges for mask generation.
  missing_red:
    hsv_lower: [0, 120, 70]
    hsv_upper: [10, 255, 255]
    hsv_lower_2: [170, 120, 70]
    hsv_upper_2: [180, 255, 255]
    opening_kernel_size: 0
    closing_kernel_size: 0
    erosion_kernel_size: 0
    exr_thresh: 60  # Threshold for EXR image processing
    saturation_thresh: 20

  missing_white: # focus of v value
    hsv_lower: [0, 0, 240]
    hsv_upper: [180, 255, 255]
    opening_kernel_size: 0
    closing_kernel_size: 0
    erosion_kernel_size: 0

  present_mat: #gray or black pixels
    hsv_lower: [15, 54, 46]
    hsv_upper: [21, 94, 150]
    opening_kernel_size: 3
    closing_kernel_size: 4
    erosion_kernel_size: 2


canonical_tag_mapping: # ensures user defined tags are mapped to canonical tags (canonical: user defined)
  missing_red: red
  missing_white: white
  present_mat: mat
  bad: bad
  other: other
  ignore: ignore

remove_tags: # canonicaltags used to remove refined masks and db entries
  - bad