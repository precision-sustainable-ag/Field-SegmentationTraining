inspect:
  dataset_name: testing_inspect_maskgen
  port: 5050
  only_tags:
    # - missing_white


refine:
  only_tags:
    # - missing_white
  
  filter_db_by_final_voxel_tags: # filters the voxel database by specific final voxel tags 
    - good

  # Morphological operations and HSV color ranges for mask generation.
  missing_red:
    exr_thresh: 60
    saturation_thresh: 80
    opening_kernel_size: 0
    closing_kernel_size: 0
    erosion_kernel_size: 0
    
  missing_white: 
    luminance_thresh: 0.4 # range [0, 1]
    prune: # Remove small/isolated blobs that are not within `radius` pixels of a large component.
      enabled: true
      area_large: 10000
      radius: 300
      min_area_keep: 30

  present_mat: #gray or black pixels
    hsv_lower: [15, 54, 46]
    hsv_upper: [21, 94, 150]
    opening_kernel_size: 3
    closing_kernel_size: 4
    erosion_kernel_size: 2


canonical_tag_mapping: # ensures user defined tags are mapped to canonical tags (canonical: user defined)
  missing_red: red
  missing_white: white
  present_mat: mat
  bad: bad
  other: other
  ignore: ignore
  good: good

relabel:
  annot_session_key: cvat_mask_refine_run_001
  task_name: ${project.name}_relabeling
  label_field: refined_mask # either initial_mask or refined_mask
  only_tags:
    # - missing_white

export_cvat:
  task_ids:
final_inspection:
  port: 6060
  dataset_name: "maskgen-final-inspect"
  remove_source: false # if true, removes source (cutout and mask) files after moving to LTS
  only_tags:
    # - missing_white
  canonical_final_tag_mapping: # ensures user defined tags are mapped to canonical tags (canonical: user defined)
    final-approved: good        # any tag containing "approve" -> final-ok
    final-reject: bad    # any tag containing "reject" -> final-reject
    final-needsfix: fix # any tag containing "needsfix" -> final-needsfix
    final-defer: defer       # any tag containing "defer" -> final-defer
