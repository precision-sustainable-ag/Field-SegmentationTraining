# Example Python logging config for Hydra jobs.
#
# You can customize formatters/handlers/loggers as needed. 
# Save this path as: conf/hydra/job_logging/custom.yaml

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "[%(asctime)s] [%(levelname)-5s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

loggers:
  hydra:
    level: INFO
    propagate: false
    handlers: [console]

  # You can add your own module logger, e.g. src.train, src.maskgen, etc.
  src:
    level: DEBUG
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
