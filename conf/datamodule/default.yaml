# LightningDataModule / dataset parameters for loading images & masks.
# Will be passed into src/datamodule.py (you’ll write this) to build train/val sets.

datamodule:
  dataset:
    image_dir: ${paths.image_dir}
    mask_dir: ${paths.mask_dir}
    processed_image_dir: ${paths.processed_image_dir}
    processed_mask_dir: ${paths.processed_mask_dir}

  transforms:
    # We’ll combine "preprocess" + "augment" in code,
    # but you can name them here for clarity.
    preprocess: ${preprocess}    # merges all preprocess.* keys
    augment: ${augment}          # merges all augment.* keys

  train_val_split: 0.8           # fraction to use for training; rest for validation

  batch_size: 16                 # default (override in train/default.yaml if needed)
  num_workers: 4
  pin_memory: true

  # (Optional) if you want to pass a random seed for splitting:
  seed: 1234
