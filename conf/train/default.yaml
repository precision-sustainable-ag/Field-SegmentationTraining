# Training hyperparameters & Lightning Trainer settings. 
# “train.*” keys map to src/train.py (LightningModule + Trainer).

batch_size: 8
max_epochs: 3
num_workers: 16
train_val_split: 0.8
pin_memory: true
seed: 42

# Optimizer:
optimizer:
  _target_: "torch.optim.AdamW"
  lr: 1e-4
  weight_decay: 1e-5

# Scheduler:
scheduler:
  _target_: "torch.optim.lr_scheduler.CosineAnnealingLR"
  T_max: 50
  eta_min: 1e-6

# Lightning Trainer arguments:
trainer:
  accelerator: "gpu"
  devices: 1 # TODO: implement gputil to automatically identify free gpu ids and set the number of gpus
  precision: 16
  deterministic: true

# Checkpoint callback:
checkpoint:
  monitor: "val/iou"
  mode: "max"
  save_top_k: 3

# EarlyStopping callback (optional):
early_stop:
  enabled: true
  monitor: "val/iou"
  mode: "max"
  patience: 10

logger:
  - _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${paths.project_train_dir}
    name: ""
    version: ""
  - _target_: pytorch_lightning.loggers.WandbLogger
    project: ${project.name}
    entity: sbaghba
    log_model: true