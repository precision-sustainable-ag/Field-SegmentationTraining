# conf/train/default.yaml
# Training hyperparameters & Lightning Trainer settings. 
# “train.*” keys map to src/train.py (LightningModule + Trainer).

batch_size: 8
max_epochs: 50
num_workers: 16
pin_memory: true
seed: 42
use_data_normalization: false

dataloader_visualizer:
  enabled: true
  num_samples: 4

# Optimizer:
optimizer:
  _target_: "torch.optim.AdamW"
  lr: 1e-4
  weight_decay: 1e-5

# Scheduler:
scheduler:
  _target_: "torch.optim.lr_scheduler.CosineAnnealingLR"
  T_max: 50
  eta_min: 1e-6

# Lightning Trainer arguments:
use_multi_gpu: true
num_gpus: 2  # Set between 1 and 3

trainer:
  accelerator: "gpu"
  devices: null  # Will be dynamically set by GPU utility
  precision: 16-mixed
  deterministic: true

losses:
  bce:
    enabled: true
    weight: 0.5
    loss:
      _target_: torch.nn.BCEWithLogitsLoss
  
  dice:
    enabled: true
    weight: 0.5
    loss:
      _target_: segmentation_models_pytorch.losses.DiceLoss
      mode: "binary"
      from_logits: true
      
  focal:
    enabled: false
    weight: 1.0
    loss:
      _target_: segmentation_models_pytorch.losses.FocalLoss
      mode: "binary"

# Checkpoint callback:
checkpoint:
  monitor: "val/fg_iou"
  mode: "max"
  save_top_k: 1
  save_last: true

# EarlyStopping callback (optional):
early_stop:
  enabled: true
  monitor: "val/fg_iou"
  mode: "max"
  patience: 10

logger:
  - _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir} # ${paths.project_train_dir}
    name: ""
    version: ""

  - _target_: pytorch_lightning.loggers.WandbLogger
    project: ${project.name}
    entity:  # Optional: your WandB entity
    log_model: true
    save_dir: ${hydra:runtime.output_dir} # ${paths.project_train_dir}
