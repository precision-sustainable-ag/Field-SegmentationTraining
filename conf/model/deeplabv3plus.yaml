# Example for a future DeeplabV3+ option. Not used in “field” initially,
# but in case you want multiple architectures you can swap to: model=deeplabv3plus

model:
  name: "deeplabv3plus"
  _target_: "segmentation_models_pytorch.DeepLabV3Plus"
  encoder_name: "resnet50"
  encoder_weights: "imagenet"
  in_channels: ${projects.field.input_channels}
  classes: ${projects.field.num_classes}
  activation: "sigmoid"
