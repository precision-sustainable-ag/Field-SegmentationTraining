# conf/model/deeplabv3plus.yaml

# Example for a future DeeplabV3+ option. Not used in “field” initially,
# but in case you want multiple architectures you can swap to: model=deeplabv3plus

arch_name: "DeepLabV3Plus"        # Used by smp.create_model
name: "deeplabv3plus"             # Optional label
encoder_name: "resnet101"         # Choose encoder, e.g. mobilenet_v2 or efficientnet-b7
encoder_weights: "imagenet"       # Pretrained weights for encoder, e.g. imagenet
in_channels: 3
classes: 1
activation: null                  # Activation function, e.g. "sigmoid2d" or "softmax2d"
decoder_attention_type: null      # Optional if you support it in UNet
